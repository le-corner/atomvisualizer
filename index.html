<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atom Visualizer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#f8fafc; --panel:#ffffff; --border:#cbd5e1; --text:#0f172a;
}
body{
  margin:0; font-family:Arial, sans-serif; background:var(--bg); color:var(--text);
  display:flex; flex-direction:column; align-items:center;
}
h1{ margin:15px; text-align:center; }
.wrapper{ display:flex; flex-wrap:wrap; justify-content:center; gap:20px; width:100%; max-width:1400px; padding:10px; }
.controls{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:15px; flex:1 1 300px; min-width:260px;
}
canvas{
  background:white; border:1px solid var(--border); border-radius:12px;
  width:95%; height:700px; max-width:900px;
}
input,select{ margin:5px 0; padding:6px 10px; border:1px solid var(--border); border-radius:6px; width:100%; box-sizing:border-box; }
#infoBox{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:15px; margin-top:15px; max-width:900px; width:95%;
}
#descBox{
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:15px; margin-top:15px; max-width:900px; width:95%; display:none; position:relative;
}
.closeBtn{ position:absolute; top:8px; right:8px; cursor:pointer; color:#dc2626; font-size:18px; }
.instructionText{
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  font-size:14px; color:rgba(0,0,0,0.4); pointer-events:none;
}
.zoomButtons{
  margin-bottom:10px; text-align:center;
}
.zoomButtons button{
  margin:0 5px; padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:white; cursor:pointer;
}
</style>
</head>
<body>

<h1><i class="fa-solid fa-atom"></i> Atom Visualizer</h1>

<div class="wrapper">
  <div class="controls">
    <div><b>Protons</b><br><input type="number" id="pInput" min="0" max="118" value="1"></div>
    <div><b>Neutrons</b><br><input type="number" id="nInput" min="0" max="200" value="0"></div>
    <div><b>Electrons</b><br><input type="number" id="eInput" min="0" max="200" value="1"></div>
    <div><b>Templates</b><br><select id="templateSelect"></select></div>
  </div>
  <div style="position:relative; flex:1 1 800px;">
    <div class="zoomButtons">
      <button onclick="zoomIn()">Zoom In <i class='fa-solid fa-magnifying-glass-plus'></i></button>
      <button onclick="zoomOut()">Zoom Out <i class='fa-solid fa-magnifying-glass-minus'></i></button>
    </div>
    <canvas id="canvas"></canvas>
    <div class="instructionText" id="instructionText"></div>
  </div>
</div>

<div id="infoBox">
  <h3>Atom Info</h3>
  <div id="infoContent"></div>
</div>

<div id="descBox">
  <span class="closeBtn" onclick="closeDesc()"><i class="fa-solid fa-xmark"></i></span>
  <div id="descContent"></div>
</div>

<script>
// ======= Periodic Table =======
const periodicTable=[
{z:1,s:"H",n:0},{z:2,s:"He",n:2},{z:3,s:"Li",n:4},{z:4,s:"Be",n:5},{z:5,s:"B",n:6},{z:6,s:"C",n:6},{z:7,s:"N",n:7},{z:8,s:"O",n:8},{z:9,s:"F",n:10},{z:10,s:"Ne",n:10},
{z:11,s:"Na",n:12},{z:12,s:"Mg",n:12},{z:13,s:"Al",n:14},{z:14,s:"Si",n:14},{z:15,s:"P",n:16},{z:16,s:"S",n:16},{z:17,s:"Cl",n:18},{z:18,s:"Ar",n:22},{z:19,s:"K",n:20},{z:20,s:"Ca",n:20},
{z:21,s:"Sc",n:24},{z:22,s:"Ti",n:26},{z:23,s:"V",n:28},{z:24,s:"Cr",n:28},{z:25,s:"Mn",n:30},{z:26,s:"Fe",n:30},{z:27,s:"Co",n:32},{z:28,s:"Ni",n:31},{z:29,s:"Cu",n:35},{z:30,s:"Zn",n:35},
{z:31,s:"Ga",n:39},{z:32,s:"Ge",n:41},{z:33,s:"As",n:42},{z:34,s:"Se",n:45},{z:35,s:"Br",n:45},{z:36,s:"Kr",n:48},{z:37,s:"Rb",n:48},{z:38,s:"Sr",n:50},{z:39,s:"Y",n:50},{z:40,s:"Zr",n:51},
{z:41,s:"Nb",n:52},{z:42,s:"Mo",n:54},{z:43,s:"Tc",n:55},{z:44,s:"Ru",n:57},{z:45,s:"Rh",n:58},{z:46,s:"Pd",n:60},{z:47,s:"Ag",n:61},{z:48,s:"Cd",n:64},{z:49,s:"In",n:66},{z:50,s:"Sn",n:69},
{z:51,s:"Sb",n:71},{z:52,s:"Te",n:76},{z:53,s:"I",n:74},{z:54,s:"Xe",n:77},{z:55,s:"Cs",n:78},{z:56,s:"Ba",n:81},{z:57,s:"La",n:82},{z:58,s:"Ce",n:82},{z:59,s:"Pr",n:82},{z:60,s:"Nd",n:84},
{z:61,s:"Pm",n:84},{z:62,s:"Sm",n:88},{z:63,s:"Eu",n:89},{z:64,s:"Gd",n:93},{z:65,s:"Tb",n:94},{z:66,s:"Dy",n:97},{z:67,s:"Ho",n:98},{z:68,s:"Er",n:99},{z:69,s:"Tm",n:100},{z:70,s:"Yb",n:104},
{z:71,s:"Lu",n:104},{z:72,s:"Hf",n:106},{z:73,s:"Ta",n:108},{z:74,s:"W",n:110},{z:75,s:"Re",n:111},{z:76,s:"Os",n:114},{z:77,s:"Ir",n:115},{z:78,s:"Pt",n:117},{z:79,s:"Au",n:118},{z:80,s:"Hg",n:121},
{z:81,s:"Tl",n:123},{z:82,s:"Pb",n:125},{z:83,s:"Bi",n:126},{z:84,s:"Po",n:125},{z:85,s:"At",n:125},{z:86,s:"Rn",n:136},{z:87,s:"Fr",n:136},{z:88,s:"Ra",n:138},{z:89,s:"Ac",n:138},{z:90,s:"Th",n:142},
{z:91,s:"Pa",n:140},{z:92,s:"U",n:146},{z:93,s:"Np",n:144},{z:94,s:"Pu",n:150},{z:95,s:"Am",n:148},{z:96,s:"Cm",n:152},{z:97,s:"Bk",n:150},{z:98,s:"Cf",n:153},{z:99,s:"Es",n:153},{z:100,s:"Fm",n:157},
{z:101,s:"Md",n:157},{z:102,s:"No",n:157},{z:103,s:"Lr",n:160},{z:104,s:"Rf",n:157},{z:105,s:"Db",n:157},{z:106,s:"Sg",n:160},{z:107,s:"Bh",n:162},{z:108,s:"Hs",n:165},{z:109,s:"Mt",n:165},{z:110,s:"Ds",n:169},
{z:111,s:"Rg",n:172},{z:112,s:"Cn",n:173},{z:113,s:"Nh",n:173},{z:114,s:"Fl",n:175},{z:115,s:"Mc",n:175},{z:116,s:"Lv",n:177},{z:117,s:"Ts",n:177},{z:118,s:"Og",n:179}
];

const templateSelect=document.getElementById("templateSelect");
templateSelect.innerHTML="<option value=''>Custom</option>";
periodicTable.forEach(a=>{
  const o=document.createElement("option");
  o.value=a.z; o.textContent=`${a.s} (${a.z})`;
  templateSelect.appendChild(o);
});

// ======= Electron configs & valence =======
const orbitalOrder=[["1s",2],["2s",2],["2p",6],["3s",2],["3p",6],["4s",2],["3d",10],["4p",6],["5s",2],["4d",10],["5p",6],["6s",2],["4f",14],["5d",10],["6p",6],["7s",2],["5f",14],["6d",10],["7p",6]];
const nobleGases={2:"He",10:"Ne",18:"Ar",36:"Kr",54:"Xe",86:"Rn",118:"Og"};

function computeConfig(Z){
  let left=Z,longhand=[];
  for(let [orb,max] of orbitalOrder){
    if(left<=0) break;
    let take=Math.min(left,max);
    longhand.push(`${orb}${take}`);
    left-=take;
  }
  return longhand;
}

// ======= PROPER shorthand showing remaining orbitals =======
function shorthandConfig(Z){
  let closest=0;
  for(let key in nobleGases) if(key<=Z) closest=key;
  if(closest===0) return computeConfig(Z);
  let long=computeConfig(Z);
  let noble=computeConfig(closest);
  let rest=long.slice(noble.length);
  return [`[${nobleGases[closest]}]`, ...rest];
}

// ======= Valence electrons =======
function valenceElectrons(longhand){
  if(!longhand.length) return 0;
  let shells = longhand.map(o => parseInt(o.match(/\d+/)[0]));
  let maxShell = Math.max(...shells);
  let valence = 0;
  for(let o of longhand){
    let shell = parseInt(o.match(/\d+/)[0]);
    if(shell === maxShell){
      valence += parseInt(o.match(/\d+$/)[0]) || 0;
    }
  }
  return valence;
}

// ======= Atom state =======
let protons=1,neutrons=0,electrons=1,angle=0,clickable=[],selected=null,scaleFactor=1;
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
const instructionText=document.getElementById("instructionText");
function resizeCanvas(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;}
window.addEventListener("resize",resizeCanvas);resizeCanvas();

// ======= Inputs =======
function validateInput(input,min,max){
  let val=parseInt(input.value);
  if(isNaN(val)||val<min) val=min;
  if(val>max) val=max;
  input.value=val;
  return val;
}
document.getElementById("pInput").addEventListener("change",()=>{protons=validateInput(event.target,0,118); updateInfo();});
document.getElementById("nInput").addEventListener("change",()=>{neutrons=validateInput(event.target,0,200); updateInfo();});
document.getElementById("eInput").addEventListener("change",()=>{electrons=validateInput(event.target,0,200); updateInfo();});
templateSelect.addEventListener("change",()=>{
  let z=parseInt(templateSelect.value); if(!z)return;
  let atom=periodicTable.find(a=>a.z===z);
  protons=atom.z; neutrons=atom.n; electrons=atom.z;
  document.getElementById("pInput").value=protons;
  document.getElementById("nInput").value=neutrons;
  document.getElementById("eInput").value=electrons;
  updateInfo();
});

// ======= Half-life =======
function estimateHalfLife(p,n){
  if(p===0) return"N/A";
  let diff=Math.abs(n/p-1);
  if(diff<0.1)return"Stable (billions of years)";
  if(diff<0.3)return"Moderately stable";
  if(diff<0.5)return"Unstable";
  return"Very unstable";
}

// ======= Draw atom =======
function drawParticle(x,y,color,type){
  ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
  ctx.strokeStyle="#334155"; ctx.stroke();
  clickable.push({x,y,r:10,type});
  if(selected && selected.x===x && selected.y===y){
    ctx.beginPath(); ctx.arc(x,y,14,0,Math.PI*2); ctx.strokeStyle="#f59e0b"; ctx.lineWidth=2; ctx.stroke(); ctx.lineWidth=1;
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height); clickable=[];
  ctx.save();
  ctx.translate(canvas.width/2,canvas.height/2);
  ctx.scale(scaleFactor,scaleFactor);
  let cx=0, cy=0;
  let nucleusR=40+(protons+neutrons)*1.2;
  ctx.beginPath();ctx.arc(cx,cy,nucleusR,0,Math.PI*2);ctx.fillStyle="#f87171";ctx.fill();
  ctx.strokeStyle="#334155";ctx.stroke();
  clickable.push({x:canvas.width/2, y:canvas.height/2, r:nucleusR*scaleFactor, type:"Nucleus"});
  for(let i=0;i<protons;i++){let x=(Math.random()-0.5)*nucleusR*0.7, y=(Math.random()-0.5)*nucleusR*0.7; drawParticle(x,y,"#ef4444","Proton");}
  for(let i=0;i<neutrons;i++){let x=(Math.random()-0.5)*nucleusR*0.7, y=(Math.random()-0.5)*nucleusR*0.7; drawParticle(x,y,"#94a3b8","Neutron");}
  let base=nucleusR+40,shells=Math.ceil(electrons/8);
  for(let s=0;s<shells;s++){ctx.beginPath();ctx.arc(cx,cy,base+60*s,0,Math.PI*2);ctx.strokeStyle="#cbd5e1";ctx.stroke();}
  for(let i=0;i<electrons;i++){
    let shell=Math.floor(i/8), radius=base+60*shell, count=Math.min(8,electrons-shell*8);
    let a=(i%count)*(Math.PI*2/count)+angle/(shell+1);
    let x=cx+radius*Math.cos(a), y=cy+radius*Math.sin(a);
    drawParticle(x,y,"#3b82f6","Electron");
  }
  angle+=0.01;
  ctx.restore();
  requestAnimationFrame(draw);
}

// ======= Info Box =======
function updateInfo(){
  let html=`<b>Protons:</b> ${protons}<br><b>Neutrons:</b> ${neutrons}<br><b>Electrons:</b> ${electrons}<br>`;
  html+=`<b>Half-Life:</b> ${estimateHalfLife(protons,neutrons)}<hr>`;
  let long=computeConfig(electrons), short=shorthandConfig(electrons);
  html+=`<b>Electron Config (longhand):</b> ${long.join(" ")}<br>`;
  html+=`<b>Electron Config (shorthand):</b> ${short.join(" ")}<br>`;
  let val=valenceElectrons(long);
  html+=`<b>Valence Electrons:</b> (${val})`;
  document.getElementById("infoContent").innerHTML=html;
}
updateInfo();

// ======= Click for Desc =======
canvas.addEventListener("click",e=>{
  let rect=canvas.getBoundingClientRect();
  let mx=e.clientX-rect.left,my=e.clientY-rect.top;
  for(let part of clickable){
    if(Math.hypot(mx-part.x,my-part.y)<=part.r){selected=part; instructionText.style.display="none"; showDesc(part); return;}
  }
});

function showDesc(part){
  document.getElementById("descBox").style.display="block";
  let html=`<h3>${part.type} Description</h3>`;
  if(part.type==="Proton") html+="Positively charged particle in nucleus.";
  else if(part.type==="Neutron") html+="Neutral particle in nucleus.";
  else if(part.type==="Electron") html+="Negatively charged particle orbiting nucleus.";
  else if(part.type==="Nucleus") html+="Contains protons and neutrons, very dense.";
  document.getElementById("descContent").innerHTML=html;
}

function closeDesc(){selected=null;document.getElementById("descBox").style.display="none";instructionText.style.display="block";}

// ======= Zoom =======
function zoomIn(){scaleFactor*=1.2;}
function zoomOut(){scaleFactor/=1.2;}

draw();
</script>
</body>
</html>
